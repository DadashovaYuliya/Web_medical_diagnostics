<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Медицинская диагностика "DYA"</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="/">Главная</a>
        <a class="p-2 btn btn-outline-primary" href="/about/">О нас</a>
        <a class="p-2 btn btn-outline-primary" href="/services/">Наши услуги</a>
        <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary" href="/appointments/">Запись на прием</a>
        <a class="p-2 btn btn-outline-primary" href="/results/">История записи и результатов</a>
        {% endif %}
    </nav>
    <div class="dropdown">
        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            Личный кабинет
        </button>
        <ul class="dropdown-menu">
            {% if user.is_authenticated %}
            <li>
                <form method="post" action="{% url 'users:logout' %}">
                    {% csrf_token %}
                    <button type="submit" >Выход</button>
                </form>
            <li>
            {% else %}
                <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
            </li>
            <li>
                <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
            </li>
            {% endif %}
            </li>
        </ul>
    </div>
</div>
