{% extends 'base.html' %}
{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Контакты</h1>
</div>

<div class="container">
    <div class="row text-start">
        <div class="col-lg-9 col-md-12">
            <div class="card mb-4 box-shadow">
                <div class="card-body">
                    <table class="table table-striped">
                        <tr>
                            <td class="w-25">Страна</td>
                            <td>Россия</td>
                        </tr>
                        <tr>
                            <td class="w-25">ИНН</td>
                            <td>4716547584</td>
                        </tr>
                        <tr>
                            <td class="w-25">Адрес</td>
                            <td>Санкт-Петербург, Невский проспект, дом 25</td>
                        </tr>
                        <tr>
                            <td class="w-25">Телефон</td>
                            <td>8-812-555-55-55</td>
                        </tr>
                    </table>
                </div>
            </div>

            <div class="mb-4">
                <h5>Как добраться</h5>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1998.8485169518694!2d30.316696977320618!3d59.934655762420874!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4696310585dfa75b%3A0x20c47b19b8fd515d!2z0J3QtdCy0YHQutC40Lkg0L_RgC4sIDI1LCDQodCw0L3QutGCLdCf0LXRgtC10YDQsdGD0YDQsywgMTkxMTg2!5e0!3m2!1sru!2sru!4v1750787192569!5m2!1sru!2sru"
                        width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>

        <div class="col-lg-3 col-md-12 mt-4 mt-lg-0">
            <div class="card mb-4 box-shadow h-100 d-flex flex-column justify-content-start">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Свяжитесь с нами</h4>
                </div>
                <div class="card-body flex-fill d-flex align-items-start">
                    <form method="post" action="" class="w-100">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="name" class="form-label">Имя</label>
                            <input type="text" name="name" class="form-control" id="name" placeholder="Ваше имя" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Телефон</label>
                            <input type="text" name="phone" class="form-control" id="phone" placeholder="Контактный телефон" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Сообщение</label>
                            <textarea name='message' id='message' rows='4' placeholder='Сообщение' required
                                class='form-control'></textarea>
                        </div>
                        <button type='submit' class='btn btn-outline-primary w-100'>Отправить</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

{% endblock %}
