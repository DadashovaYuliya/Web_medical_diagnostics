{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Медицинская диагностика "DYA"</h1>
    <p class="lead">Медицинская диагностика "DYA" - мы позаботимся о Вашем здоровье.</p>
</div>

<div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        {% for service in services %}
        <div class="col">
            <div class="card shadow-sm">
                <img src="{{ service.image | media_filter }}" class="card-img-top" alt="Нет изображения">
                <div class="card-body">
                    <h5 class="card-title">{{ service.name }}</h5>
                    <p class="card-text">{{ service.description | truncatechars:100 }}</p>
                    <a href="{% url 'medic:services_detail' service.pk %}" class="btn btn-primary">Подробнее</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
